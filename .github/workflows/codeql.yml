# CodeQL advanced analysis — fleet security standard.
# security-extended + security-and-quality strictly subsumes the default and extended suites.
# Matrix covers every CodeQL-supported language detected in this repository
# (per code-scanning default-setup detection): c-cpp, csharp, go, java-kotlin,
# javascript-typescript, python, ruby, rust.
name: CodeQL

# Don't grant any access by default (CKV2_GHA_1; same convention as ci.yml)
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1" # weekly, Monday 04:31 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Matrix = languages with FIRST-PARTY code. Verified by census
          # (2026-11-19): first-party code is shell (lib/*.sh), one python
          # script (scripts/npm_audit_exceptions.py), and these workflow
          # files. Every other language in the repo exists only as the
          # deliberately-bad linter fixtures under test/linters/ (excluded
          # below as the transparent fixture filter) — scanning fixture
          # languages yields findings on files designed to be broken, or
          # fails extraction with "No source files found".
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          # Narrow, transparent SARIF filter: the entire test/ tree is
          # upstream test harness and deliberately-bad linter fixtures
          # (test/linters/*_bad_*.js/.html exist so the suite can assert
          # the linters catch them; test/inspec holds the audit controls).
          # First-party code (lib/, scripts/, .github/) stays fully scanned.
          config: |
            paths-ignore:
              - test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
