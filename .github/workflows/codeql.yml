# CodeQL advanced analysis — fleet security standard.
# security-extended + security-and-quality strictly subsumes the default and extended suites.
# Matrix covers every CodeQL-supported language detected in this repository
# (per code-scanning default-setup detection): c-cpp, csharp, go, java-kotlin,
# javascript-typescript, python, ruby, rust.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1' # weekly, Monday 04:31 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: none
          - language: csharp
            build-mode: none
          - language: go
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # Rust and Go have no single root build here (their projects are the
      # linter test fixtures under test/linters/), and Go does not support
      # build-mode: none — so build the fixture projects manually for
      # extraction (manual build flow: init -> build -> analyze).
      - name: Build Rust projects
        if: matrix.language == 'rust'
        run: |
          cargo build --manifest-path test/linters/rust_clippy/bad/Cargo.toml
          cargo build --manifest-path test/linters/rust_clippy/good/Cargo.toml

      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          (cd test/linters/go_modules/go_modules_good && go build ./...)
          (cd test/linters/go_modules/go_modules_bad && go build ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
